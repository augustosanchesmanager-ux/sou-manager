# CI — Política de CI/CD e Quality Gates (ADR-022, FASE 6 item 6.1)
#
# Gates obrigatórios aprovados na política:
#   - typecheck
#   - build
#   - unit
#   - architecture:ci
#
# Gatilhos (aprovados no ADR-022):
#   - pull_request
#   - push em main
#
# Estrutura: jobs separados em paralelo + job agregado final.
# Cada gate roda em um job isolado; o job agregado "validate" só conclui
# o pipeline quando todos os gates obrigatórios passam.
#
# NOTA: gate vermelho BLOQUEIA o merge (política ADR-022 §9). Este workflow
# reflete fielmente o estado do repositório; falhas nos gates são registradas
# e bloqueiam a promoção até correção.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: typecheck
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: build
        run: npm run build

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: unit
        run: npm run test

  architecture:
    name: architecture:ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: architecture:ci
        run: npm run architecture:ci

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: lint
        run: npm run lint

  # Job agregado: condição final do pipeline.
  # Roda somente após os 4 gates obrigatórios passarem (GitHub falha o `needs` se
  # qualquer um for vermelho), consolidando o status geral em um único check.
  # lint NÃO é obrigatório (advisory) — não entra no needs.
  validate:
    name: validate (agregado)
    runs-on: ubuntu-latest
    needs: [typecheck, build, unit, architecture]
    if: success()
    steps:
      - name: Todos os gates obrigatórios passaram
        run: echo "typecheck, build, unit, architecture:ci OK (ADR-022)"
