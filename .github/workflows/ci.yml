# CI - Quality Gates (ADR-022, Phase 6.1)
#
# Mandatory gates: typecheck, build, unit, architecture:ci
# Advisory gate: lint (non-blocking)
#
# Triggers: pull_request, push to main
#
# Structure: parallel jobs + final aggregated validate job.
# Each gate runs in an isolated job; the validate job only succeeds
# when all mandatory gates pass.

name: CI

on:
  push:
    branches:
      - main

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: typecheck
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: build
        run: npm run build

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: unit
        run: npm run test

  architecture:
    name: architecture:ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: architecture:ci
        run: npm run architecture:ci

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gate: lint
        run: npm run lint

  # Aggregated job: final pipeline status.
  # Only runs after the 4 mandatory gates pass.
  # lint is NOT mandatory (advisory) - not in needs.
  validate:
    name: validate (aggregated)
    runs-on: ubuntu-latest
    needs: [typecheck, build, unit, architecture]
    if: success()
    steps:
      - name: All mandatory gates passed
        run: echo "typecheck, build, unit, architecture:ci OK (ADR-022)"
