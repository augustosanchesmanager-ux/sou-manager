name: Deploy Validation

# HARDENING-02 — o gatilho casava `deployment.ref == 'refs/heads/main'`, mas a
# Vercel grava em `ref` o SHA de 40 chars (prova: deployment 6796077341, ref =
# d176407...). Condicao sempre falsa: todo run historico saiu "skipped".
#
# O environment e' o contrato real da Vercel aqui. Atencao ao EN-DASH (U+2013)
# em 'Production – smg-barber' — hifen (U+002D) nao casa. As literais cobrem
# separadores que a Vercel ja usou no historico (en-dash, hifen, espaco, barra,
# underscore) e o prefixo 'Production' cobre rotulo imprevisto; divergencia de
# rotulo fica visivel no relatorio.
#
# As guardas sao o que impede falso positivo. O historico real do repo tem 14
# environments distintos, incluindo 'Production – smg-estetica', 'Production –
# sou-manager' e 'Production – soumama.ger'. Por isso:
#   contains(..., 'smg-barber')  -> so dispara para o projeto deste repo;
#                                   'smg-estetica' e 'sou-manager' ficam de fora.
#   !contains(..., 'staging')     -> 'Production – smg-barber-staging' existe
#                                   no historico (2x) e NAO e producao.
on:
  deployment_status:

jobs:
  validate-deployment:
    name: deploy validation
    runs-on: ubuntu-latest
    # Interpolacao formal ${{ }}: o runner avalia o bloco como uma unica
    # expressao. O event_name evita avaliacao espuria em push/PR.
    if: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'smg-barber') && !contains(github.event.deployment.environment, 'staging') && (github.event.deployment.environment == 'Production – smg-barber' || github.event.deployment.environment == 'Production - smg-barber' || startsWith(github.event.deployment.environment, 'Production')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve deployment URL
        id: resolve
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
          FALLBACK_URL: https://barber.soumanager.com
        run: |
          if [ -n "$DEPLOYMENT_URL" ] && [ "$DEPLOYMENT_URL" != "null" ]; then
            echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
            echo "url_source=deployment_status.target_url" >> "$GITHUB_OUTPUT"
            echo "✅ Deployment URL: $DEPLOYMENT_URL"
          else
            echo "⚠️  target_url ausente — usando fallback de produção: $FALLBACK_URL"
            echo "url=$FALLBACK_URL" >> "$GITHUB_OUTPUT"
            echo "url_source=fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for deployment to be available
        run: |
          URL="${{ steps.resolve.outputs.url }}"
          echo "Waiting for deployment to be ready at: $URL"
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -fs -o /dev/null -w '%{http_code}' --max-time 10 "$URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment available (HTTP $HTTP_CODE) after ${i}0 seconds"
              exit 0
            fi
            echo "⏳ Attempt $i/30 — HTTP $HTTP_CODE, retrying in 10s..."
            sleep 10
          done
          echo "❌ Deployment not available after 300 seconds"
          exit 1

      - name: Health check
        run: |
          URL="${{ steps.resolve.outputs.url }}"
          echo "Running health check against: $URL"
          # O app e um SPA Vite (HashRouter) sem rota /api/health — a raiz
          # responde 200 e e o unico sinal de vida confiavel. A rota /api/health
          # fica como tentativa: se algum dia for exposta, valida mais forte.
          ROOT_CODE=$(curl -fs -o /dev/null -w '%{http_code}' --max-time 15 "$URL/" || echo "000")
          echo "GET $URL/ -> HTTP $ROOT_CODE"
          if [ "$ROOT_CODE" = "200" ]; then
            echo "✅ Health check PASSED on / (HTTP $ROOT_CODE)"
            API_CODE=$(curl -fs -o /dev/null -w '%{http_code}' --max-time 15 "$URL/api/health" || echo "000")
            if [ "$API_CODE" = "200" ]; then
              echo "✅ /api/health also available (HTTP $API_CODE)"
            else
              echo "ℹ️  /api/health not exposed (HTTP $API_CODE) — expected for Vite SPA"
            fi
          else
            echo "❌ Health check FAILED on / (HTTP $ROOT_CODE)"
            exit 1
          fi

      - name: E2E smoke against deployed URL
        run: |
          URL="${{ steps.resolve.outputs.url }}"
          echo "Running E2E smoke against: $URL"
          npm run test:e2e:smoke
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve.outputs.url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Audit summary
        if: always()
        run: |
          echo "## Deploy Validation Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit (SHA) | ${{ github.event.deployment.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event.deployment.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Exact match on canonical name | ${{ github.event.deployment.environment == 'Production – smg-barber' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployment URL | ${{ steps.resolve.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL source | ${{ steps.resolve.outputs.url_source }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> "$GITHUB_STEP_SUMMARY"
